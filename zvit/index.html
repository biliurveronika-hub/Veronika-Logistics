<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veronika Logistics — звіт</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17313F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F5;--ink:#14232E;--muted:#546473;--line:rgba(20,35,46,.12);--blue:#3E6E91;--sky:#9DBBD9;--forest-d:#17313F;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:26px;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.card{width:100%;max-width:470px;background:#fff;border:1px solid var(--line);border-radius:36px;padding:46px 42px;box-shadow:0 50px 90px -50px rgba(20,35,46,.5)}
.label{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.label::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
h1{font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1.02;margin:20px 0 12px}
h1 em{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;color:var(--blue)}
p{font-size:15px;color:var(--muted);line-height:1.55}
label{display:block;margin-top:28px;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input{width:100%;margin-top:10px;padding:16px 18px;border-radius:18px;border:1.5px solid var(--line);background:#F8FAFC;font:inherit;font-size:16px;color:var(--ink);transition:border-color .3s,background .3s}
input:focus{outline:0;border-color:var(--blue);background:#fff}
button{margin-top:18px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:17px 24px;border:0;border-radius:999px;background:var(--sky);color:var(--forest-d);font:inherit;font-weight:700;font-size:16px;cursor:pointer;transition:transform .3s var(--ease),background .3s}
button:hover{transform:translateY(-2px);background:#8FB2D4}
button[disabled]{opacity:.6;cursor:default;transform:none}
.err{margin-top:16px;font-size:14px;color:#B3261E;display:none}
.err.on{display:block}
.foot{margin-top:30px;padding-top:22px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<form class="card" id="gate" autocomplete="off">
  <span class="label">Приватний доступ</span>
  <h1>Звіт за <em>місяць</em></h1>
  <p>Сторінка закрита паролем. Введи його — і відкриється звіт за перший місяць роботи та план на наступний.</p>
  <label for="pw">Пароль</label>
  <input type="password" id="pw" autocomplete="current-password" placeholder="••••••••" autofocus>
  <button type="submit" id="go">Відкрити звіт</button>
  <div class="err" id="err">Пароль не підходить. Перевір розкладку й великі літери.</div>
  <div class="foot">Veronika Logistics · звіт підготувала Ольга Восканян</div>
</form>

const ITER = 250000;
const KEY = "vl_zvit_pw";

function bytes(b64){ const s = atob(b64); const a = new Uint8Array(s.length); for (let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }

async function open_(pw){
  const raw  = bytes(PAYLOAD);
  const salt = raw.slice(0,16), iv = raw.slice(16,28), data = raw.slice(28);
  const km   = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key  = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data));
  try { localStorage.setItem(KEY, pw); } catch(e){}
  document.open(); document.write(html); document.close();
}

const form = document.getElementById('gate');
const err  = document.getElementById('err');
const go   = document.getElementById('go');

form.addEventListener('submit', async e => {
  e.preventDefault();
  err.classList.remove('on');
  go.disabled = true; go.textContent = 'Відкриваємо…';
  try { await open_(document.getElementById('pw').value); }
  catch(ex){ err.classList.add('on'); go.disabled = false; go.textContent = 'Відкрити звіт'; }
});

/* вже вводила пароль на цьому пристрої — не питаємо вдруге */
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved) { try { await open_(saved); } catch(ex){ try { localStorage.removeItem(KEY); } catch(e){} } }
})();
