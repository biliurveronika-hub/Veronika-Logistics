<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Умови курсу — Veronika Logistics</title>
<link rel="canonical" href="https://veronika-logistics.com/#taryfy">
<script>
(function(){
  var q = new URLSearchParams(location.search), pk = q.get('pick'), keep = new URLSearchParams();
  q.forEach(function(v, k){ if (/^utm_/.test(k)) keep.set(k, v); });
  var to = '/';
  if (pk === 'p1' || pk === 'p2') { keep.set('pick', pk); to = '/?' + keep.toString(); }
  else if (pk === 'zn' || pk === 'vp' || location.hash === '#konsultatsiia') { keep.set('c', '1'); to = '/?' + keep.toString() + '#konsultaciya'; }
  else { var s = keep.toString(); to = '/' + (s ? '?' + s : '') + '#taryfy'; }
  location.replace(to);
})();
</script>
</head>
<body><p style="font-family:sans-serif;padding:24px"><a href="/#taryfy">Умови курсу — на головній сторінці →</a></p></body>
</html>
